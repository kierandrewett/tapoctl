[package]
name = "tapoctl"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock", "serde"], default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = "0.12.0"
if-addrs = "0.15.0"
keyring = { version = "3.6.3", features = ["linux-native"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
tapo = "0.9.0"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.8"
